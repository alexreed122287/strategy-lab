name: Daily build

# Runs the dashboard refresh and the buy digest on GitHub's runners instead of
# Alex's Mac, so the site updates whether that machine is awake, asleep or in a
# bag. Mirrors steps 3-7 of scripts/daily_build.sh.
#
# WHAT THIS CANNOT DO, stated up front: steps 1-2 of the Mac build call the
# local generator (market-data-brain / agentic-cron) that produces the SCAN and
# SIGNALS blobs - the RSI2 and MFI arm rows. That generator is not in this repo
# and cannot run here. So this workflow refreshes TRACK, BOOKSIG (Gap Widen and
# Z-Score, computed from fresh bars) and the shadow forward book, and leaves
# SCAN/SIGNALS at whatever the Mac last published. That is the same "TRACK-only
# mode" the Mac build itself runs in when SL_BLOB_BUILD_CMD is unconfigured.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   TRADIER_TOKEN   your Tradier production token
#   NOTIFY_CONFIG   the full contents of ~/.strategy_lab_notify.json
# Neither is ever printed; both are written to files the runner destroys.

on:
  schedule:
    # GitHub cron is UTC with no DST handling, so both are listed and the guard
    # step below keeps exactly one of them. 20:30 UTC = 15:30 CDT (summer),
    # 21:30 UTC = 15:30 CST (winter).
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # run it by hand from the GitHub UI - works on a phone

permissions:
  contents: write
  issues: write  # failure-notify step opens/comments the reusable issue

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Only one of the two cron firings should proceed, and a manual run always
      # should. GitHub's scheduler drifts by tens of minutes under load, so this
      # guards on the Chicago hour AND on whether today already built, rather
      # than on an exact minute.
      - name: Should this run proceed?
        id: guard
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, json, os, re, subprocess, zoneinfo
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/Chicago"))
          manual = os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
          today = now.date().isoformat()
          log = subprocess.run(["git", "log", "--oneline", "-20"],
                               capture_output=True, text=True).stdout
          # "Already built" cannot be judged from the commit NAME alone. On
          # 2026-08-07 a manual dispatch at 07:03 CT - before the market opened -
          # published a commit called "daily build 2026-08-07" carrying 08-06
          # bars. That name then blocked the real post-close build: the 16:12 CT
          # scheduled firing hit this check and skipped, and the day's data was
          # lost until a human noticed. A build only counts if the page actually
          # holds today's session, so read the date it captured.
          named = ("daily build %s" % today) in log
          try:
              page = open("index.html").read()
              captured = json.loads(re.search(r"const BOOKSIG = (.*?);\n",
                                              page, re.S).group(1)).get("as_of")
          except Exception:
              captured = None
          already = named and captured == today
          # Hour window, and it has to absorb GitHub's drift rather than assume
          # punctuality. Observed on this repo: the 20:30 UTC cron has NEVER
          # fired; the 21:30 one fired at 21:50 (+20m) and 22:37 (+67m). The
          # original 15..16 CT window would silently skip that 22:37 firing and
          # lose the session with no error anywhere. The market closes at 15:00
          # CT, so every bar is final from then on and any build up to the
          # evening is equally valid - there is no reason to be narrow. Stops
          # before 19:00 CT, where the UTC date rolls over.
          ok = manual or (now.weekday() < 5 and 15 <= now.hour <= 18 and not already)
          print("proceed=%s" % ("true" if ok else "false"))
          # The commit message MUST be stamped with this same Chicago date, not
          # with the runner's UTC `date +%F`. They differ after 19:00 CT, so a
          # late or manual evening run stamped TOMORROW's date and then
          # suppressed tomorrow's real build via the already-built check - the
          # dashboard simply stops updating and nothing errors. Export it.
          print("today=%s" % today)
          print("why=%s CT, manual=%s, already_built=%s" % (
              now.strftime("%Y-%m-%d %H:%M"), manual, already))
          PY

      - name: Skip notice
        if: steps.guard.outputs.proceed != 'true'
        run: echo "Skipping - ${{ steps.guard.outputs.why }}"

      - name: Credentials
        if: steps.guard.outputs.proceed == 'true'
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          NOTIFY_CONFIG: ${{ secrets.NOTIFY_CONFIG }}
        run: |
          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN secret is not set - the fetch would fail"; exit 1
          fi
          printf '%s' "$TRADIER_TOKEN" > "$HOME/.tradier_token"
          chmod 600 "$HOME/.tradier_token"
          if [ -n "$NOTIFY_CONFIG" ]; then
            printf '%s' "$NOTIFY_CONFIG" > "$HOME/.strategy_lab_notify.json"
            chmod 600 "$HOME/.strategy_lab_notify.json"
            python3 -c "import json,os;json.load(open(os.path.expanduser('~/.strategy_lab_notify.json')))" \
              || { echo "::error::NOTIFY_CONFIG is not valid JSON"; exit 1; }
          else
            echo "::warning::NOTIFY_CONFIG not set - the page will refresh but no email will send"
          fi

      # ---- step 3: fresh bars straight from Tradier (~6 min for ~716 names)
      - name: Fetch bars
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python3 scripts/dump_closes.py --index index.html \
            --out /tmp/bars.json --days 600 --ohlcv
          python3 -c "import json;b=json.load(open('/tmp/bars.json'));print('bars for',len(b),'symbols')"

      # There is no market-data-brain here, so this used to emit earnings:0 -
      # which is not cosmetic: Z-Score's exit rule has a pre-earnings condition,
      # so the cloud was running that book with the rule INERT while the Mac ran
      # it armed. Same book, two behaviours. The repo-committed seed closes that.
      # Still fail-quiet: a missing or expired seed means no entry for a symbol
      # and its flags stay off, never a wrong date.
      - name: Earnings (repo seed - no local brain cache here)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          mkdir -p /tmp/earn_empty
          python3 scripts/next_earnings.py --dir /tmp/earn_empty \
            --seed-file data/earnings_seed.json --out /tmp/earnings.json \
            || echo '{}' > /tmp/earnings.json
          # A seed that quietly runs out puts us back where we started, so say so.
          # Measure LIVE forward coverage, not a static _expires date. The 08-04
          # seed carried _expires 2026-09-03 and read as healthy while it was
          # already 64% spent - it kept past dates, so its symbol count flattered
          # it. What matters is how many symbols still have a date ahead of them.
          python3 - <<'PY'
          import datetime, json, zoneinfo
          try:
              s = json.load(open("data/earnings_seed.json"))
          except Exception:
              print("::warning::no earnings seed - Z-Score pre-earnings rule is inert")
              raise SystemExit
          today = datetime.datetime.now(zoneinfo.ZoneInfo("America/Chicago")).date().isoformat()
          dates = s.get("dates") or {}
          seeded = len(dates)
          live = sum(1 for v in dates.values()
                     if any(str(x)[:10] >= today for x in (v or [])))
          n = len(json.load(open("/tmp/earnings.json")))
          last = s.get("_last_date") or ""
          pct = (100.0 * live / seeded) if seeded else 0.0
          # Thresholds are about usefulness, not correctness: the seed can never
          # emit a wrong date, it can only run out and go quiet.
          if live == 0:
              print(f"::warning::earnings seed fully spent (today {today}, last "
                    f"date {last}) - Z-Score's pre-earnings exit is INERT again. "
                    f"Refresh data/earnings_seed.json or wire a live fetch.")
          elif pct < 50:
              print(f"::warning::earnings seed {pct:.0f}% forward ({live} of "
                    f"{seeded} symbols still have a future date, last {last}) - "
                    f"refresh data/earnings_seed.json soon.")
          else:
              print(f"earnings: {n} symbols resolved; seed {live}/{seeded} "
                    f"({pct:.0f}%) still forward-dated, through {last}")
          PY

      # The RSI2/MFI/z signal generator, cloud-wired per owner approval
      # 2026-08-14. The math is the Mac generator's verbatim (see
      # scripts/signals_cloud.py header and signals_fidelity_gate.py for the
      # 145/145 fidelity record); bars are Tradier split-only - the brain's
      # own native basis - so this is the same rule on the same kind of data.
      # Fail-quiet on purpose: if this step fails, SIGNALS stays at its last
      # publish and the page's freshness gate + banner handle it as before.
      # The 600-day fetch above exists for this step (len>=320 gate).
      - name: Generate SIGNALS (cloud generator)
        if: steps.guard.outputs.proceed == 'true'
        run: |
          if ! python3 scripts/signals_cloud.py --bars /tmp/bars.json \
               --earnings /tmp/earnings.json \
               --universe data/signals_universe.json --splice index.html; then
            echo "::warning::cloud signals generator failed - SIGNALS left at its last publish (page shows it as stale)"
          fi

      # ---- steps 4, 4b, 4c: the splices
      - name: Splice TRACK / BOOKSIG / shadow book
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python3 scripts/track_snapshot_reference.py /tmp/bars.json \
            --earnings /tmp/earnings.json --splice index.html \
            --source "tradier github-actions $(date +%F)"
          python3 scripts/scan_book_signals.py --bars /tmp/bars.json \
            --page index.html --earnings /tmp/earnings.json --splice
          python3 scripts/shadow_book.py --bars /tmp/bars.json \
            --page index.html --earnings /tmp/earnings.json \
            --ledger data/shadow_book.json --splice
          python3 scripts/robert_scan.py --bars /tmp/bars.json \
            --page robert.html --earnings /tmp/earnings.json \
            --universe robert_universe.txt --splice
          python3 scripts/robert_shadow.py --bars /tmp/bars.json \
            --page robert.html --earnings /tmp/earnings.json \
            --universe robert_universe.txt \
            --ledger data/robert_shadow.json --splice

      # ---- step 4d: health stamp, marked so its origin is visible on the page
      - name: Health stamp
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python3 - <<'PY'
          import json, re, datetime, zoneinfo
          html = open("index.html").read()
          bars = json.load(open("/tmp/bars.json"))
          earn = json.load(open("/tmp/earnings.json"))
          g = lambda n: json.loads(re.search(r"const %s = (.*?);\n" % n, html, re.S).group(1))
          booksig, shadow, track = g("BOOKSIG"), g("SHADOW"), g("TRACK")
          signals = g("SIGNALS")
          sig_bar = max([r.get("as_of") or "" for r in signals.get("signals") or []] or [""])
          now = datetime.datetime.now(zoneinfo.ZoneInfo("America/Chicago"))
          h = {"build": now.strftime("%Y-%m-%d %H:%M"), "built_by": "github-actions",
               "bars_ok": len(bars), "universe": max(len(track.get("tickers") or {}), len(bars)),
               "signals_as_of": sig_bar,
               "signals_stale": bool(sig_bar and sig_bar != track.get("as_of")),
               "earnings": len(earn), "booksig_rows": len(booksig.get("rows") or []),
               "shadow_open": sum(1 for p in shadow.get("open") or [] if p.get("state") == "open"),
               "shadow_closed": shadow.get("closed_total") or 0}
          line = "const HEALTH = " + json.dumps(h, separators=(",", ":")) + ";"
          html2, n = re.subn(r"const HEALTH = .*?;\n", lambda _m: line + "\n", html, count=1, flags=re.S)
          assert n == 1, "no HEALTH line"
          open("index.html", "w").write(html2)
          print("health:", h)
          PY

      # ---- step 5: fail-closed validation. Nothing publishes if a blob is broken.
      - name: Validate
        if: steps.guard.outputs.proceed == 'true'
        run: |
          python3 - <<'PY'
          import json, re
          html = open("index.html").read()
          for n in ["SCAN","BASKETS","SIGNALS","REGIME","DAILY","CALLS","TF","METHOD",
                    "BOOKS","TRACK","BOOKSIG","NOTIFY","SHADOW","HEALTH"]:
              m = re.search(r"const %s = (.*?);\n" % n, html, re.S)
              assert m, "missing blob: " + n
              json.loads(m.group(1))
          track = json.loads(re.search(r"const TRACK = (.*?);\n", html, re.S).group(1))
          assert track and track.get("tickers"), "TRACK is empty - refusing to publish"
          assert "robert.html" in html and "paper-log.html" in html, \
              "nav links to ROBERT / Paper-Fill Log missing - interface regressed"
          assert "FRESHNESS GATE" in html, \
              "signals freshness gate missing from index.html - interface regressed"
          signals = json.loads(re.search(r"const SIGNALS = (.*?);\n", html, re.S).group(1))
          sig_bar = max([r.get("as_of") or "" for r in signals.get("signals") or []] or [""])
          if sig_bar and sig_bar != track.get("as_of"):
              print("::warning::SIGNALS feed is stale (bar %s vs TRACK %s) - "
                    "the page will suppress those rows" % (sig_bar, track["as_of"]))
          print("validation OK:", len(track["tickers"]), "tickers as of", track["as_of"])
          h2 = open("robert.html").read()
          assert "ROBSIG:START" in h2 and "ROBSIG:END" in h2, "robert.html ROBSIG markers missing"
          assert "ROBSHADOW:START" in h2 and "ROBSHADOW:END" in h2, "robert.html ROBSHADOW markers missing"
          PY

      # ---- step 6: publish
      - name: Commit and push
        if: steps.guard.outputs.proceed == 'true'
        id: publish
        run: |
          git config user.name "strategy-lab-bot"
          git config user.email "actions@github.com"
          git add index.html data/shadow_book.json robert.html data/robert_shadow.json
          if git diff --cached --quiet; then
            echo "no changes to publish"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            # Chicago date from the guard, NOT `date +%F` (UTC) - see the guard.
            git commit -m "daily build ${{ steps.guard.outputs.today }}"
            # Push back to the ref this ran from. Hardcoding main meant a manual
            # dispatch from a branch would shove that whole branch onto main.
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- step 7: notifications. Never fail the run over email.
      - name: Send alert and digest
        if: steps.guard.outputs.proceed == 'true' && steps.publish.outputs.published == 'true'
        run: |
          python3 scripts/notify_buys.py --page index.html || echo "alert failed (non-fatal)"
          python3 scripts/notify_buys.py --page index.html --simple || echo "digest failed (non-fatal)"

      - name: Wipe credentials
        if: always()
        run: rm -f "$HOME/.tradier_token" "$HOME/.strategy_lab_notify.json"

      # A failed build is otherwise SILENT - notify_buys only fires on a
      # successful publish. The 2026-08-14 TRACK-clobber failure ("no `const
      # TRACK = ...;` line found") would have killed every nightly with no
      # signal anywhere. Same reusable-issue pattern as scanner's gex_scan.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh label create daily-build-failure --description "Daily build workflow failures" --color d73a4a 2>/dev/null || true
          existing=$(gh issue list --label daily-build-failure --state open --json number --jq '.[0].number' || echo "")
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ts=$(date -u +%Y-%m-%dT%H:%MZ)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Daily build failed again on ${ts}. Run: ${run_url}"
          else
            body="The Daily build failed on ${ts}. Run: ${run_url}. Known causes: a page blob was deleted rather than replaced (log shows 'no \`const X = ...;\` line found' - restore index.html from the last good cloud build), TRADIER_TOKEN expired, or a transient fetch error. This issue is reused for subsequent failures."
            gh issue create --title "Daily build failed: $(date -u +%Y-%m-%d)" --label daily-build-failure --body "$body"
          fi
