name: robert-chain-gate

# Unattended Monday-morning option-book sweep for pending ROBERT universe adds.
# Dual cron covers EDT/EST; the script itself only proceeds when it is 9 AM ET
# on a Monday (or when force=true on a manual run). Read-only market data.
on:
  schedule:
    - cron: "40 13 * * 1"
    - cron: "40 14 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: bypass the market-hours guard (off-hours test)
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: robert-chain-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: chain gate sweep
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/robert_chain_gate.py
      - name: publish
        run: |
          git config user.name "robert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git commit -m "ROBERT chain gate $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push origin main
          fi
