name: jason-entry-snap

# Capture the REAL option quote at JASON's entry moment (2026-09-12) - the
# same capture as robert-entry-snap, against JASON's own ledger and store.
#
# The strategy enters at the next open, ~09:45 ET. The nightly build cannot see
# that moment, so it has always reconstructed the entry premium with
# Black-Scholes - a 4.5% mean absolute error against real chains, and no spread
# at all. With capital deferred indefinitely (08/26/2026) the paper record IS
# the deliverable, so the quote is measured rather than modelled.
#
# Snaps every name the previous night's build queued, whether or not it ends up
# filling: deciding the gap-recovered skip here would be a second copy of a rule
# that must not disagree with the ledger's. An unused snapshot costs one call.
#
# Read-only market data. Commits a JSON file. Places no orders - it cannot;
# nothing in this repo holds a trading credential.

on:
  schedule:
    # 13:45 UTC = 09:45 EDT, 14:45 UTC = 09:45 EST - the intended moment. The
    # earlier firings exist because GitHub's scheduler ran BOTH of those crons
    # at 17:11-17:55 UTC on 2026-09-10 and 09-11 (3.5 h late; the earlier
    # measured drift was +78 min), and the script's old 09:30-11:30 ET window
    # rejected every one of them while the run reported success. The first
    # live TAKE since the re-enable (ATI, 09-10 bar) was never snapped.
    #
    # This is a LADDER against that drift, not four tries at one time. A rung
    # that fires on time is pre-open, fails in_entry_window(), and returns
    # before the ledger is read or a single Tradier call is made - it costs a
    # runner minute and nothing else. A rung that drifts lands near the open.
    # The window is the whole session and the FROZEN KEY, not the clock, stops
    # duplicates, so the earliest in-window firing wins and every later one is
    # a no-op. An extra rung can therefore only ever improve a capture; it
    # cannot spoil one.
    #
    # 10:45 added 2026-09-18 on measured evidence: the three captures since
    # this ladder was built landed at 11:32, 11:40 and 13:02 ET - late_min of
    # 107, 115 and 197 - so even the 11:45 rung is arriving well after the
    # open. At the observed +180 drift, 10:45 UTC lands at 09:45 EDT exactly;
    # at the worst observed +210 it lands 10:15 ET, still far inside anything
    # measured so far. Fired on time it is 06:45 EDT / 05:45 EST, pre-open,
    # and skips.
    - cron: "45 10 * * 1-5"
    - cron: "45 11 * * 1-5"
    - cron: "45 12 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "45 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: bypass the market-hours window (off-hours test)
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: jason-entry-snap
  cancel-in-progress: false

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot the queued entries
        env:
          TRADIER_TOKEN: ${{ secrets.TRADIER_TOKEN }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -z "$TRADIER_TOKEN" ]; then
            echo "::error::TRADIER_TOKEN secret is not set"; exit 1
          fi
          if [ "$FORCE" = "true" ]; then
            python3 scripts/robert_chain_snap.py --force --ledger data/jason_shadow.json --snaps data/jason_chain_snaps.json
          else
            python3 scripts/robert_chain_snap.py --ledger data/jason_shadow.json --snaps data/jason_chain_snaps.json
          fi

      - name: Publish
        run: |
          git config user.name "jason-bot"
          git config user.email "actions@users.noreply.github.com"
          # The store is committed empty, so this always matches. Kept
          # explicit rather than `git add -A`: this job holds
          # contents:write and has no business committing anything else.
          git add data/jason_chain_snaps.json
          if git diff --cached --quiet; then
            echo "no new snapshots"
          else
            git commit -m "JASON entry snapshots $(date -u +%F)"
            git pull --rebase --autostash origin main
            git push origin main
          fi
